# Build the static site on GitHub, upload it to Hostinger over FTP.
#
# Why this exists: Hostinger shared/Cloud hosting cannot build a Next.js app —
# its Git integration only serves files, it does not run `next build`. So the
# build happens here on GitHub (which has Node), and only the finished static
# `out/` folder is shipped to Hostinger. Hostinger never builds anything, which
# is exactly why its build step kept failing.
#
# ── One-time setup (you do this, once) ───────────────────────────────────────
# In GitHub: repo → Settings → Secrets and variables → Actions → New secret.
# Add these three, from hPanel → Files → FTP Accounts:
#   FTP_SERVER     e.g. 82.180.xxx.xxx  or  ftp.kishorekumarcoach.com
#   FTP_USERNAME   e.g. u123456789.kishorekumarcoach
#   FTP_PASSWORD   the FTP account password
#
# Optional — only if the lead form should reach your CRM (Supabase anon key,
# never the service_role key):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#
# After the secrets are saved, every push to main deploys automatically. You can
# also run it by hand: Actions tab → this workflow → Run workflow.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys upload at once — a half-finished upload would serve a
# broken site.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Fail early with a readable message. Without this the FTP action stops
      # with "Input required and not supplied: server", which doesn't tell you
      # that the cause is a missing GitHub secret.
      - name: Check FTP secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$FTP_SERVER" ]   || missing="$missing FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them in GitHub → Settings → Secrets and variables → Actions."
            echo "The values come from hPanel → Files → FTP Accounts."
            exit 1
          fi
          echo "All FTP secrets present."

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Baked into the client at build time. Absent → form still submits but
          # doesn't forward, which is the current behaviour, not a build error.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy out/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The build output — trailing slash means "contents of", not the folder.
          local-dir: ./out/
          # Primary-domain docroot on Hostinger. If kishorekumarcoach.com is set
          # up as an addon/secondary domain, change this to its own docroot,
          # e.g. /domains/kishorekumarcoach.com/public_html/
          server-dir: /public_html/
          # Keeps a manifest on the server so only changed files upload after the
          # first run — deploys go from minutes to seconds.
          # Preserve anything you upload manually that isn't part of the build.
          exclude: |
            **/.git*
            **/.git*/**
